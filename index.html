<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Websocket live test</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            padding: 30px;
            background: white;
        }
        #log {
            background: #0000;
            padding: 10px;
            height: 300px;
            overflow-y: scroll;
            border: 1px solid #333;
        }
        .status-on {
            color: aquamarine;
        }
        .status-off {
            color: crimson;
        }
    </style>
</head>
<body>
    <h1>Websocket Broadcast Console</h1>
    <p id="status" class="status-off">Connecting...</p>

    <form action="" id="message-form">
        <input type="text" id="message-input"
        placeholder="Send Cargo..." required />
        <button type="submit">Deploy Message</button>
    </form>

    <h3>Live Stream Logs:</h3>
    <pre id="log"></pre>
</body>
<script>
    const statusEL = document.getElementById('status');
    const log = document.getElementById('log');
    const input = document.getElementById('message-input');

    const socket = new WebSocket('ws://localhost:8080');

    const appendLog = (label, message) => {
        const entry = `${new Date().toLocaleTimeString()}
        ${label} - ${message}\n`
        log.textContent = entry + log.textContent;
    }
    socket.addEventListener('open', () => {
        statusEL.textContent = 'CONNECTED: ws://localhost:8080'
        statusEL.className = 'status-on';
        appendLog(`[SYSTEM]`, 'Tunnel Established.');
    });

    socket.addEventListener('close', () => {
        statusEL.textContent = 'CLOSE: ws://localhost:8080'
        statusEL.className = 'status-off';
        appendLog('[SYSTEM]', 'Tunnel Collapsed');
    });

    socket.addEventListener('message', (e) =>{
        appendLog('[RECIEVED]', e.data);
    })

    document.getElementById('message-form').addEventListener('submit', (e) => {
        e.preventDefault();

        if(socket.readyState !== WebSocket.OPEN){
            appendLog('[ERROR]', 'No active tunnel');
        }

        const msg = input.value.trim();
        socket.send(msg);
        appendLog('[SENT]', msg);
        input.value = '';
    })
</script>
</html>
